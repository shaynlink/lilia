[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liliadb"
version = "0.1.0a1"
description = "Official Python SDK for LiliaDB, the local-first multimodel embedded & daemon database."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "LiliaDB Contributors", email = "dev@liliadb.org" }
]
keywords = ["liliadb", "database", "embedded", "local-first", "kv", "json", "sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shaynlink/lilia"
Repository = "https://github.com/shaynlink/lilia.git"
Issues = "https://github.com/shaynlink/lilia/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["liliadb*"]
