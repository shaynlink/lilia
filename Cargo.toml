[workspace]
resolver = "2"
members = [
  "apps/lilia-cli",
  "apps/lilia-daemon",
  "apps/lilia-mcp",
  "crates/lilia-core",
  "crates/lilia-node-native",
  "crates/lilia-plugin-api",
  "crates/lilia-protocol",
  "crates/lilia-storage-sqlite",
  "plugins/lilia-plugin-json",
  "plugins/lilia-plugin-kv",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.91.1"
license = "Apache-2.0"
repository = "https://github.com/shaynlink/lilia"

[workspace.dependencies]
anyhow = "1.0.100"
criterion = "0.7.0"
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hex = "0.4.3"
libloading = "0.9.0"
napi = { version = "3.4.0", features = ["napi8", "tokio_rt"] }
napi-derive = "3.3.0"
rand = "0.9.2"
rmp-serde = "1.3.0"
rusqlite = { version = "=0.40.2", features = ["backup", "bundled", "functions", "serde_json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
