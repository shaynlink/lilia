name: release

on:
  push:
    tags: ["v*.*.*-alpha.*", "v*.*.*"]

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore annotated tag
        shell: bash
        run: |
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Require annotated signed tag
        shell: bash
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test -n "$RELEASE_SIGNING_PUBLIC_KEY"
          printf '%s' "$RELEASE_SIGNING_PUBLIC_KEY" | gpg --import
          git verify-tag "refs/tags/$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm nx run-many -t build,lint,test --all

  compat-verify:
    needs: verify
    name: Cross-Runtime Compatibility Gate (Node, Bun, Deno)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build local native addon and daemon
        run: |
          cargo build -p lilia-node-native -p lilia-daemon --release
          pnpm install --frozen-lockfile
          pnpm --filter @liliadb/node build
          mkdir -p packages/node-linux-x64-gnu
          cp target/release/liblilia_node_native.so packages/node-linux-x64-gnu/lilia_node_native.node
      - name: Verify Node.js
        run: node --test packages/node/dist/**/*.test.js
      - name: Verify Bun
        run: |
          bun test packages/node/dist/database.test.js
          bun test packages/node/tests/compat-bun.test.ts
      - name: Verify Deno
        run: deno test --allow-all packages/node/tests/compat-deno.test.ts

  pypi:
    needs: verify
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.91.1
      - name: Build local daemon for Python tests
        run: cargo build -p lilia-daemon
      - name: Run Python test suite
        run: PYTHONPATH=packages/python python -m unittest discover -s packages/python/tests -v
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build packages/python
      - name: Verify package distributions
        run: twine check --strict packages/python/dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
          skip-existing: true

  native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            package: node-darwin-arm64
            artifact: darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package: node-darwin-x64
            artifact: darwin-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: node-linux-arm64-gnu
            artifact: linux-arm64-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: node-linux-x64-gnu
            artifact: linux-x64-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: node-win32-x64-msvc
            artifact: win32-x64-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --target ${{ matrix.target }} -p lilia-node-native -p lilia-cli -p lilia-daemon -p lilia-mcp --release
      - name: Build and stage prebuild package
        shell: bash
        run: node tools/build-prebuilds.mjs --target "${{ matrix.target }}" --pack --dest "$GITHUB_WORKSPACE/release"
      - name: Archive standalone CLI and Daemon binaries
        shell: bash
        run: |
          mkdir -p bin-archive
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/lilia.exe" bin-archive/ 2>/dev/null || cp "target/release/lilia.exe" bin-archive/
            cp "target/${{ matrix.target }}/release/lilia-daemon.exe" bin-archive/ 2>/dev/null || cp "target/release/lilia-daemon.exe" bin-archive/
            cp "target/${{ matrix.target }}/release/lilia-mcp.exe" bin-archive/ 2>/dev/null || cp "target/release/lilia-mcp.exe" bin-archive/
            tar -czf "$GITHUB_WORKSPACE/release/lilia-${{ matrix.artifact }}.tar.gz" -C bin-archive .
          else
            cp "target/${{ matrix.target }}/release/lilia" bin-archive/ 2>/dev/null || cp "target/release/lilia" bin-archive/
            cp "target/${{ matrix.target }}/release/lilia-daemon" bin-archive/ 2>/dev/null || cp "target/release/lilia-daemon" bin-archive/
            cp "target/${{ matrix.target }}/release/lilia-mcp" bin-archive/ 2>/dev/null || cp "target/release/lilia-mcp" bin-archive/
            tar -czf "$GITHUB_WORKSPACE/release/lilia-${{ matrix.artifact }}.tar.gz" -C bin-archive .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*

  publish:
    needs: [native, compat-verify, pypi]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: sha256sum release/* > release/SHA256SUMS
      - name: Update Homebrew formula with release checksums
        run: |
          node tools/update-homebrew-formula.mjs --version "$GITHUB_REF_NAME" --dir release
          cp Formula/liliadb.rb Formula/lilia.rb release/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - run: pnpm install --frozen-lockfile
      - name: Publish Platform Prebuilds
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in packages/node-*; do
            if [ -f "$pkg/package.json" ]; then
              echo "Publishing $pkg..."
              pnpm --dir "$pkg" publish --no-git-checks --access public --provenance || true
            fi
          done
      - name: Publish SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter @liliadb/node publish --no-git-checks --access public --provenance
      - name: Release archives and formulas
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
