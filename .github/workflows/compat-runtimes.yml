name: compat-runtimes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node.js v${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: cargo build -p lilia-node-native -p lilia-daemon --release
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @liliadb/node build
      - name: Stage native binary for Node test runner
        run: |
          mkdir -p packages/node-linux-x64-gnu
          cp target/release/liblilia_node_native.so packages/node-linux-x64-gnu/lilia_node_native.node
      - name: Run Node test suite
        run: node --test packages/node/dist/**/*.test.js

  bun:
    name: Bun 1.x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cargo build -p lilia-node-native -p lilia-daemon
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @liliadb/node build
      - name: Run Bun tests
        run: |
          bun test packages/node/dist/database.test.js
          bun test packages/node/tests/compat-bun.test.ts

  deno:
    name: Deno 2.x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cargo build -p lilia-daemon
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @liliadb/node build
      - name: Run Deno compatibility tests
        run: deno test --allow-all --no-check --node-modules-dir=auto packages/node/tests/compat-deno.test.ts
